<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Color Code Generator</h1>
        <div id="colorBox"></div>
        <div class="color-info">
            <h2 id="hexCode">#000000</h2>
            <p id="rgbCode">RGB(0, 0, 0)</p>
        </div>
        <div class="buttons">
            <button id="generateBtn">Generate Color</button>
            <button id="copyBtn">Copy HEX</button>
        </div>
        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
